<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caine's Fireworks Spectacular</title>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--red:#e3243b;--red-d:#8a0c1a;--blue:#2f5bd8;--gold:#ffd34d;--ink:#1b1b2f;--cream:#fff7d6}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#05030b;color:#fff;font-family:'Fredoka',system-ui,sans-serif;user-select:none;touch-action:manipulation}
  #sky{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
  header{position:fixed;top:12px;left:0;right:0;text-align:center;pointer-events:none;z-index:5}
  h1{font-family:'Rye';font-weight:400;margin:0;font-size:clamp(22px,3.8vw,44px);color:var(--gold);text-shadow:0 3px 0 var(--red-d),0 6px 0 var(--ink)}
  .sub{color:#cbbff0;margin:2px 0 0;font-size:14px}
  /* the tent & crowd silhouette */
  #ground{position:fixed;left:0;right:0;bottom:0;height:22vh;pointer-events:none;z-index:3}
  #ground svg{width:100%;height:100%;display:block}
  #crowd{position:fixed;left:0;right:0;bottom:2vh;display:flex;justify-content:center;gap:clamp(6px,2vw,28px);align-items:flex-end;pointer-events:none;z-index:4}
  .fan{width:clamp(34px,5vw,64px);filter:brightness(.25) saturate(.4);transition:filter .5s}
  .fan svg{width:100%;height:auto;display:block}
  .fan.lit{filter:brightness(1.05) saturate(1.1) drop-shadow(0 0 14px var(--glow,#fff));transition:filter .05s}
  .fan.ooh{animation:ooh .6s cubic-bezier(.3,1.7,.5,1)}
  @keyframes ooh{40%{transform:translateY(-10px) scale(1.06,.95)}}
  #caineBox{width:clamp(48px,6vw,80px)}
  /* palette */
  #palette{position:fixed;left:50%;transform:translateX(-50%);top:84px;z-index:6;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:96vw}
  .shape{font:700 13px 'Fredoka';color:var(--ink);background:var(--cream);border:3px solid var(--ink);border-radius:999px;padding:5px 11px;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
  .shape.sel{background:var(--gold);transform:translateY(-2px);box-shadow:3px 4px 0 var(--ink)}
  .shape:focus-visible,.btn:focus-visible{outline:3px dashed var(--gold);outline-offset:2px}
  #controls{position:fixed;right:14px;bottom:14px;z-index:7;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .btn{font:700 14px 'Fredoka';color:var(--ink);background:var(--gold);border:3px solid var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);text-decoration:none}
  .btn.red{background:var(--red);color:#fff}
  .btn.blue{background:var(--blue);color:#fff}
  .btn.on{background:#5dff8c}
  #back{position:fixed;left:14px;bottom:14px;z-index:7}
  #count{position:fixed;left:14px;top:14px;z-index:6;font-weight:700;font-size:13px;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.2);border-radius:10px;padding:5px 9px}
  @media (max-width:700px){#palette{top:74px}.shape{font-size:12px;padding:4px 8px}#count{display:none}}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<header><h1>Caine's Fireworks Spectacular</h1><p class="sub">Pick a shape. Click the sky. Ooh. Aah.</p></header>
<div id="palette"></div>
<div id="count">🎆 <b id="n">0</b> fireworks</div>
<div id="ground"><svg viewBox="0 0 1000 200" preserveAspectRatio="none">
  <path d="M0 200 L0 150 Q250 120 500 140 Q750 160 1000 130 L1000 200 Z" fill="#0a0614"/>
  <g transform="translate(500 40)">
    <path d="M0 -40 L130 90 L-130 90 Z" fill="#1b0f2e"/>
    <path d="M0 -40 L40 90 L-40 90 Z" fill="#241640"/>
    <path d="M0 -40 V-62" stroke="#1b0f2e" stroke-width="4"/><path d="M0 -62 L22 -55 L0 -48 Z" fill="#3a1f55"/>
  </g>
</svg></div>
<div id="crowd"></div>
<div id="controls">
  <button class="btn blue" id="auto">🌙 Auto-show: off</button>
  <button class="btn red" id="finale">💥 GRAND FINALE</button>
</div>
<a class="btn" id="back" href="../../index.html">← back to the Big Top</a>

<script src="../../assets/cast.js"></script>
<script>
(() => {
  'use strict';
  const { CAST, say, wireCaine, pick } = window.TADC;

  // ═══ crowd (the cast watching the show) ═══
  const crowd = document.getElementById('crowd');
  const fans = {};
  ['pomni', 'jax', 'ragatha', 'caine', 'gangle', 'zooble', 'kinger'].forEach((who) => {
    const el = document.createElement('div');
    el.className = 'fan'; if (who === 'caine') el.id = 'caineBox';
    el.innerHTML = CAST[who];
    crowd.appendChild(el); fans[who] = el;
  });
  const caine = wireCaine(fans.caine);
  const bubbleFan = document.createElement('div');
  bubbleFan.className = 'fan'; bubbleFan.style.width = 'clamp(22px,3vw,38px)'; bubbleFan.innerHTML = CAST.bubble;
  crowd.insertBefore(bubbleFan, fans.gangle); fans.bubble = bubbleFan;

  const OOH = {
    pomni: ['Ooh! ...wait, are those safe? Are any of these safe?!', 'Pretty! Terrifying! Pretty!'],
    jax: ['Eh. Seen better. Okay, that one was decent.', 'Do one shaped like me. No, a better one.'],
    ragatha: ['Oooooh! Aaaaah! I\'m saying it for everyone!', 'That one looked like a hug!'],
    gangle: ['My mask can\'t smile any harder! It\'s TRYING!'],
    zooble: ['Okay. Fine. That\'s cool. I\'ll allow it.'],
    kinger: ['Is the sky on fire?! Oh, it\'s on PURPOSE. Wonderful!'],
    bubble: ['Can I eat one? Can I eat a sky-sparkle?'],
  };

  // ═══ shapes ═══
  // Each shape samples points (and colors) from an offscreen drawing, so bursts form real pictures.
  const SAMPLE = 120;
  const off = document.createElement('canvas'); off.width = off.height = SAMPLE;
  const octx = off.getContext('2d', { willReadFrequently: true });
  function sampleCanvas(step = 4, tint = null) {
    const d = octx.getImageData(0, 0, SAMPLE, SAMPLE).data, pts = [];
    for (let y = 0; y < SAMPLE; y += step) for (let x = 0; x < SAMPLE; x += step) {
      const i = (y * SAMPLE + x) * 4;
      if (d[i + 3] > 140) {
        // Dark outline pixels would vanish against the night sky, so lift them to a glowing violet.
        const lum = 0.3 * d[i] + 0.59 * d[i + 1] + 0.11 * d[i + 2];
        const col = tint ? pick(tint) : lum < 60 ? '#8a7ad8' : `rgb(${d[i]},${d[i + 1]},${d[i + 2]})`;
        pts.push({ x: x - SAMPLE / 2, y: y - SAMPLE / 2, c: col });
      }
    }
    return pts;
  }
  function svgShape(svg) {
    return new Promise((res) => {
      const img = new Image();
      img.onload = () => {
        octx.clearRect(0, 0, SAMPLE, SAMPLE);
        const a = img.width / img.height, h = a > 1 ? SAMPLE / a : SAMPLE, w = a > 1 ? SAMPLE : SAMPLE * a;
        octx.drawImage(img, (SAMPLE - w) / 2, (SAMPLE - h) / 2, w, h);
        res(sampleCanvas(3));
      };
      img.onerror = () => res(null);
      const sized = svg.trim().replace('<svg ', '<svg width="240" height="240" ');
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(sized);
    });
  }
  function textShape(text, colors, size = 34) {
    octx.clearRect(0, 0, SAMPLE, SAMPLE);
    octx.fillStyle = '#fff'; octx.textAlign = 'center'; octx.textBaseline = 'middle';
    octx.font = `900 ${size}px Fredoka, sans-serif`;
    const lines = text.split('\n');
    lines.forEach((l, i) => octx.fillText(l, SAMPLE / 2, SAMPLE / 2 + (i - (lines.length - 1) / 2) * size));
    return sampleCanvas(3, colors);
  }
  function pathShape(draw, colors) {
    octx.clearRect(0, 0, SAMPLE, SAMPLE); octx.fillStyle = '#fff'; octx.beginPath(); draw(octx); octx.fill();
    return sampleCanvas(4, colors);
  }
  const PALETTE = [
    { id: 'classic', label: '✨ Classic' },
    { id: 'caine', label: '🎩 Caine' },
    { id: 'pomni', label: '🃏 Pomni' },
    { id: 'bubble', label: '🫧 Bubble' },
    { id: 'kinger', label: '♚ Kinger' },
    { id: 'gangle', label: '🎭 Gangle' },
    { id: 'jax', label: '🐰 Jax' },
    { id: 'heart', label: '💗 Heart' },
    { id: 'star', label: '⭐ Star' },
    { id: 'noexit', label: '🚪 NO EXIT' },
    { id: 'random', label: '🎲 Surprise me' },
  ];
  const SHAPES = {};
  const ready = (async () => {
    for (const who of ['caine', 'pomni', 'bubble', 'kinger', 'gangle', 'jax']) SHAPES[who] = await svgShape(CAST[who]);
    await document.fonts.ready.catch(() => {});
    SHAPES.noexit = textShape('NO\nEXIT', ['#5dff8c', '#b6ffcf', '#ffffff'], 40);
    SHAPES.heart = pathShape((c) => {
      c.moveTo(60, 100); c.bezierCurveTo(10, 70, 10, 25, 38, 22); c.bezierCurveTo(52, 20, 60, 34, 60, 40);
      c.bezierCurveTo(60, 34, 68, 20, 82, 22); c.bezierCurveTo(110, 25, 110, 70, 60, 100);
    }, ['#ff7eb6', '#ff3d8b', '#ffd1e6']);
    SHAPES.star = pathShape((c) => {
      for (let i = 0; i < 10; i++) { const r = i % 2 ? 22 : 55, a = i / 10 * Math.PI * 2 - Math.PI / 2; c.lineTo(60 + Math.cos(a) * r, 62 + Math.sin(a) * r); }
      c.closePath();
    }, ['#ffd34d', '#fff1a8', '#ffffff']);
  })();
  const CALLOUTS = {
    caine: ["And now... ME! In FIRE! I'm GORGEOUS!", "A portrait of the artist! The artist is me!"],
    pomni: ["A tribute to our newest member! She's thrilled! Look at her!"],
    bubble: ['Bubble! In the sky! Nobody let Bubble see this!'],
    kinger: ['Long live the king! In sparkles! Briefly!'],
    gangle: ['The mask of COMEDY! Brought to you by FIRE!'],
    jax: ['Jax, in lights! He asked for this! He did not ask for this!'],
    heart: ['Ahh, love! In the form of controlled explosions!'],
    star: ["A star! You're ALL stars! Especially me!"],
    noexit: ['A friendly reminder! In LETTERS OF FIRE!', "Isn't it reassuring? There's NO EXIT! Ha!"],
    classic: ['Classic! Timeless! Loud!', 'Ooooh! Aaaaah! Please say ooh and aah!'],
  };

  // palette UI
  let current = 'classic';
  const palEl = document.getElementById('palette');
  PALETTE.forEach((p) => {
    const b = document.createElement('button');
    b.className = 'shape' + (p.id === current ? ' sel' : ''); b.textContent = p.label;
    b.addEventListener('click', (e) => { e.stopPropagation(); current = p.id; palEl.querySelectorAll('.shape').forEach((x) => x.classList.toggle('sel', x === b)); });
    palEl.appendChild(b);
  });

  // ═══ audio ═══
  let ac, master, noiseBuf;
  function audio() {
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = 0.6;
      const comp = ac.createDynamicsCompressor(); master.connect(comp); comp.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    ac.resume();
    return ac;
  }
  function whistle(dur) {
    if (!ac) return;
    const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(500 + Math.random() * 200, t); o.frequency.exponentialRampToValueAtTime(1800 + Math.random() * 600, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.05, t + 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
  }
  function boom(big = 1) {
    if (!ac) return;
    const t = ac.currentTime;
    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(1400, t); lp.frequency.exponentialRampToValueAtTime(120, t + 1.2);
    const g = ac.createGain(); g.gain.setValueAtTime(0.9 * big, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
    s.connect(lp); lp.connect(g); g.connect(master); s.start(t); s.stop(t + 1.5);
    const o = ac.createOscillator(), og = ac.createGain(); o.frequency.setValueAtTime(90, t); o.frequency.exponentialRampToValueAtTime(30, t + 0.5);
    og.gain.setValueAtTime(0.6 * big, t); og.gain.exponentialRampToValueAtTime(0.0001, t + 0.6); o.connect(og); og.connect(master); o.start(t); o.stop(t + 0.7);
    // crackle afterwards
    for (let i = 0; i < 14; i++) {
      const ct = t + 0.6 + Math.random() * 1.2, cs = ac.createBufferSource(); cs.buffer = noiseBuf;
      const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 3000;
      const cg = ac.createGain(); cg.gain.setValueAtTime(0.12 * Math.random(), ct); cg.gain.exponentialRampToValueAtTime(0.0001, ct + 0.03);
      cs.connect(hp); hp.connect(cg); cg.connect(master); cs.start(ct, Math.random()); cs.stop(ct + 0.04);
    }
  }

  // ═══ simulation ═══
  const cv = document.getElementById('sky'), ctx = cv.getContext('2d');
  let W, H, stars = [];
  function resize() {
    const dpr = Math.min(2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    stars = Array.from({ length: Math.round(W * H / 4000) }, () => ({ x: Math.random() * W, y: Math.random() * H * 0.8, r: Math.random() * 1.3 + 0.2, p: Math.random() * 6 }));
    ctx.fillStyle = '#05030b'; ctx.fillRect(0, 0, W, H);
  }
  resize(); addEventListener('resize', resize);
  const rockets = [], parts = [];
  let total = 0, flash = 0, flashCol = '#fff';
  const dotSize = 4;

  function launch(tx, ty, shapeId) {
    if (shapeId === 'random') shapeId = pick(PALETTE.filter((p) => p.id !== 'random')).id;
    const sx = W / 2 + (Math.random() - 0.5) * W * 0.3, sy = H * 0.82;
    const dur = 0.9 + Math.random() * 0.3;
    rockets.push({ sx, sy, x: sx, y: sy, tx, ty, t: 0, dur, shape: shapeId, trail: [] });
    whistle(dur);
  }
  function explode(r) {
    const scale = Math.min(W, H) * 0.0042 * (0.9 + Math.random() * 0.2);
    let pts = SHAPES[r.shape];
    const classic = !pts || r.shape === 'classic';
    if (classic) {
      const cols = pick([['#ff6b7d', '#ffd34d'], ['#6fb6ff', '#ffffff'], ['#5dff8c', '#ffd34d'], ['#b07cff', '#ff7eb6']]);
      pts = [];
      for (let ring = 0; ring < 3; ring++) for (let i = 0; i < 60; i++) {
        const a = i / 60 * Math.PI * 2 + ring * 0.1, rr = (30 + ring * 14) * (0.9 + Math.random() * 0.2);
        pts.push({ x: Math.cos(a) * rr, y: Math.sin(a) * rr, c: cols[ring % 2] });
      }
    }
    for (const p of pts) {
      parts.push({ cx: r.x, cy: r.y, tx: r.x + p.x * scale, ty: r.y + p.y * scale, x: r.x, y: r.y, vx: 0, vy: 0, c: p.c, t: 0,
        hold: classic ? 0.15 : 1.1 + Math.random() * 0.3, life: 2.4 + Math.random() * 0.8, tw: Math.random() * 6 });
    }
    // smoke ring sparks
    for (let i = 0; i < 40; i++) {
      const a = Math.random() * Math.PI * 2, s = 3 + Math.random() * 5;
      parts.push({ spark: true, x: r.x, y: r.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, c: '#fff7d6', t: 0, life: 0.6 + Math.random() * 0.5 });
    }
    flash = 1; flashCol = pts[Math.floor(pts.length / 2)].c;
    boom(r.shape === 'noexit' ? 1.2 : 1);
    if (r.shape === 'noexit') window.TADC.mystery && window.TADC.mystery.find('stub-8'); // 🎟️ mystery clue: NO EXIT in letters of fire
    total++; document.getElementById('n').textContent = total;
    // the crowd reacts
    Object.entries(fans).forEach(([who, el]) => {
      el.style.setProperty('--glow', flashCol);
      el.classList.add('lit'); setTimeout(() => el.classList.remove('lit'), 260);
      if (Math.random() < 0.35) { el.classList.remove('ooh'); void el.offsetWidth; el.classList.add('ooh'); }
    });
    if (CALLOUTS[r.shape] && Math.random() < (classic ? 0.15 : 0.55)) caine.talk(pick(CALLOUTS[r.shape]), 2600);
    else if (Math.random() < 0.18) { const who = pick(Object.keys(OOH)); say(fans[who], pick(OOH[who]), 2400); }
  }

  const easeOut = (x) => 1 - Math.pow(1 - x, 3);
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    // trails: fade the previous frame instead of clearing
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(5,3,11,0.22)'; ctx.fillRect(0, 0, W, H);
    for (const s of stars) { ctx.fillStyle = `rgba(255,255,255,${0.25 + 0.35 * Math.abs(Math.sin(now / 900 + s.p))})`; ctx.fillRect(s.x, s.y, s.r, s.r); }
    if (flash > 0) { ctx.fillStyle = flashCol; ctx.globalAlpha = flash * 0.08; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; flash = Math.max(0, flash - dt * 4); }
    ctx.globalCompositeOperation = 'lighter';
    // rockets
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i]; r.t += dt;
      const k = Math.min(1, r.t / r.dur), e = easeOut(k);
      r.x = r.sx + (r.tx - r.sx) * e + Math.sin(r.t * 30) * 1.2; r.y = r.sy + (r.ty - r.sy) * e;
      ctx.fillStyle = '#ffe9a8'; ctx.beginPath(); ctx.arc(r.x, r.y, 2.4, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,160,60,.6)'; ctx.fillRect(r.x - 1, r.y, 2, 10 + Math.random() * 8);
      if (k >= 1) { explode(r); rockets.splice(i, 1); }
    }
    // particles: fly into formation, hold & twinkle, then fall away
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i]; p.t += dt;
      if (p.spark) { p.vy += 0.15; p.vx *= 0.96; p.vy *= 0.96; p.x += p.vx; p.y += p.vy; }
      else if (p.t < 0.45) { const e = easeOut(p.t / 0.45); p.x = p.cx + (p.tx - p.cx) * e; p.y = p.cy + (p.ty - p.cy) * e; }
      else if (p.t < 0.45 + p.hold) { p.x = p.tx + Math.sin(p.t * 3 + p.tw) * 0.6; p.y = p.ty + (p.t - 0.45) * 6; }
      else { if (!p.vy) { p.vx = (p.x - p.cx) * 0.01; p.vy = 0.3; } p.vy += 0.05; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; }
      const fade = p.t < 0.45 + (p.hold || 0) ? 1 : Math.max(0, 1 - (p.t - 0.45 - (p.hold || 0)) / (p.life - 0.45 - (p.hold || 0)));
      if (p.t > p.life || fade <= 0) { parts.splice(i, 1); continue; }
      const tw = 0.75 + 0.25 * Math.abs(Math.sin(p.t * 12 + (p.tw || 0)));
      // sparks glow additively; picture-dots draw normally so character colors stay true
      ctx.globalCompositeOperation = p.spark ? 'lighter' : 'source-over';
      ctx.globalAlpha = fade * tw;
      ctx.fillStyle = p.c;
      const sz = p.spark ? 1.6 : dotSize;
      ctx.beginPath(); ctx.arc(p.x, p.y, sz / 2, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ═══ input ═══
  cv.addEventListener('pointerdown', async (e) => {
    const shape = current, x = e.clientX, y = Math.min(e.clientY, H * 0.7); // capture before awaiting
    audio(); await ready;
    launch(x, y, shape);
  });
  addEventListener('keydown', async (e) => {
    if (e.key === ' ' || e.key === 'Enter') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
      e.preventDefault();
      const shape = current;
      audio(); await ready;
      launch(W * (0.2 + Math.random() * 0.6), H * (0.2 + Math.random() * 0.3), shape);
    }
  });
  let autoTimer = null;
  const autoBtn = document.getElementById('auto');
  autoBtn.addEventListener('click', async () => {
    audio(); await ready;
    if (autoTimer) { clearInterval(autoTimer); autoTimer = null; autoBtn.textContent = '🌙 Auto-show: off'; autoBtn.classList.remove('on'); return; }
    autoBtn.textContent = '🌙 Auto-show: ON'; autoBtn.classList.add('on');
    caine.talk("Sit back! Relax! I'll handle the explosions! I'm a PROFESSIONAL!", 3000);
    const go = () => launch(W * (0.15 + Math.random() * 0.7), H * (0.18 + Math.random() * 0.32), 'random');
    go(); autoTimer = setInterval(go, 1700);
  });
  let finaleBusy = false;
  document.getElementById('finale').addEventListener('click', async () => {
    if (finaleBusy) return;
    finaleBusy = true; audio(); await ready;
    caine.talk('LADIES AND GENTLEMEN! THE GRAND! FINALE!', 3000);
    const order = ['classic', 'heart', 'star', 'bubble', 'pomni', 'jax', 'gangle', 'kinger', 'classic', 'classic', 'noexit', 'caine'];
    order.forEach((s, i) => setTimeout(() => {
      const last = i === order.length - 1;
      launch(last ? W / 2 : W * (0.15 + Math.random() * 0.7), last ? H * 0.3 : H * (0.15 + Math.random() * 0.35), s);
    }, i * (i < 8 ? 450 : 260) + (i === order.length - 1 ? 900 : 0)));
    setTimeout(() => { finaleBusy = false; caine.talk("THANK YOU! THANK YOU! I'll be here all week! I'll be here FOREVER!", 3600); }, 8200);
  });

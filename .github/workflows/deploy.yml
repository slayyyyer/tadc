name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run test suites
        run: |
          status=0
          for test in $(find . -name '*.test.cjs' -not -path './tools/training-runs/*' | sort); do
            echo "::group::$test"
            node "$test" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Run Python tests
        working-directory: tools
        run: python3 -m unittest -v import_public_dialogue_test

      - name: Stage static site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.freebuff' \
            --exclude '_site' \
            ./ _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          base="${PAGE_URL%/}"
          attempts="${VERIFY_ATTEMPTS:-10}"
          failed=0
          # path|expected content-type fragment
          probes="
          index.html|text/html
          acts/01-find-the-exit/index.html|text/html
          assets/adventures.js|javascript
          assets/hangouts.css|text/css
          "
          while IFS='|' read -r path expect; do
            [ -z "$path" ] && continue
            url="$base/$path"
            ok=0
            for attempt in $(seq 1 "$attempts"); do
              read -r code type <<<"$(curl -s -o /dev/null -w '%{http_code} %{content_type}' --max-time 20 --retry 2 --retry-all-errors "$url")"
              echo "Attempt $attempt: $url -> $code ($type)"
              if [ "$code" = "200" ] && [[ "$type" == *"$expect"* ]]; then
                ok=1
                break
              fi
              sleep 6
            done
            if [ "$ok" != "1" ]; then
              echo "::error::$url returned $code with content-type '$type' (wanted 200 and $expect)"
              failed=1
            fi
          done <<< "$probes"
          exit $failed
